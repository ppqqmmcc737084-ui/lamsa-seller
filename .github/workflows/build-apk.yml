name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: lamsa_seller

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ✅ الخطوة الجديدة: إنشاء ملف المفاتيح ديناميكياً من الأسرار
      - name: Create OneSignal Keys File
        run: |
          mkdir -p lib/config
          echo "class OneSignalKeys { static const String appId = '${{ secrets.ONESIGNAL_APP_ID }}'; static const String apiKey = '${{ secrets.ONESIGNAL_API_KEY }}'; }" > lib/config/onesignal_keys.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamsa-seller-release-apk
          path: lamsa_seller/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30